name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-all.mjs

  browser:
    name: Headless browser regressions
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/temporary_files/ci/browsers
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install browser tooling
        run: npm install --prefix temporary_files/ci --no-save --no-package-lock playwright-core@1.63.0
      - name: Install Chromium
        run: node temporary_files/ci/node_modules/playwright-core/cli.js install --no-shell chromium
      - name: Run headless suites
        shell: pwsh
        run: |
          $env:HDM_PLAYWRIGHT_PATH = Join-Path $PWD 'temporary_files/ci/node_modules/playwright-core/index.mjs'
          $env:HDM_CHROMIUM = node -p "require('./temporary_files/ci/node_modules/playwright-core').chromium.executablePath()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in @('document-lifecycle', 'editor-lifecycle', 'rule-management', 'svg-cutouts')) {
            node "scripts/test-$suite.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
